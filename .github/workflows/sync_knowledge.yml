name: Sync Superspace knowledge
on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: knowledge-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install indexing dependencies
        run: pip install -r requirements.txt
      - name: Update changed articles and vectors
        run: python -m scripts.sync_knowledge
      - name: Validate index
        run: python -m scripts.verify --offline
      - name: Commit only when changed
        run: |
          git config user.name 'superspace-index-bot'
          git config user.email 'superspace-index-bot@users.noreply.github.com'
          git add data/corpus.json data/index
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh Superspace support index'
            git push
          fi
