
name: Sync Superspace knowledge

on:
  schedule:
    - cron: "19 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -q tests

      - name: Synchronize Superspace knowledge
        run: python -m scripts.sync_knowledge

      - name: Validate knowledge index
        run: |
          python - <<'PY'
          from scripts.verify import check_index
          import json

          result = check_index()
          print("INDEX VALID:")
          print(json.dumps(result, indent=2))
          PY

      - name: Publish updated knowledge
        run: |
          git config user.name "superspace-index-bot"
          git config user.email "superspace-index-bot@users.noreply.github.com"

          git add data/corpus.json data/index/

          if git diff --cached --quiet; then
            echo "Knowledge base unchanged. No commit required."
          else
            git commit -m "chore: refresh Superspace support index"
            git push origin HEAD:main
          fi
